name: bench

x-limits: &limits
  cpus: 2
  mem_limit: 1g

services:
  db:
    image: postgres:18
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 2s
      retries: 60

  rust:
    <<: *limits
    image: rust-starter:prod
    environment:
      DATABASE_URL: postgres://postgres@db:5432/rust
      PUBLIC_URL: http://rust:8080
    ports:
      - "9081:8080"

  nuxt:
    <<: *limits
    image: nuxt-starter:prod
    environment:
      NUXT_DATABASE_URL: postgres://postgres@db:5432/nuxt
      NUXT_SITE_ORIGIN: http://nuxt:8080
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?run.mjs generates it}
      NITRO_CLUSTER_WORKERS: 2
    ports:
      - "9082:8080"
