services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8092:3000"
    environment:
      NUXT_DATABASE_URL: postgres://postgres@db:5432/app
      NUXT_SITE_ORIGIN: http://localhost:8092
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  node_modules:
  db-data:
