[package]
name = "rust-starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
anyhow = { version = "1.0.104", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:anyhow"]
