[package]
name = "rust-starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["router", "fullstack"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9db1d9a8a60a7e05bc1284ad6bd1d16ea74bbed3", default-features = false, version = "0.0.1", features = ["router"] }
dioxus-icons = { version = "=0.2.0-alpha.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
num-format = "0.4.4"
anyhow = { version = "1.0.104", optional = true }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono"], optional = true }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-chrono"], optional = true }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
axum_session = { version = "0.22.0", optional = true }
axum_session_auth = { version = "0.22.0", optional = true }
axum_session_sqlx = { version = "0.12.0", default-features = false, features = ["postgres", "tls-rustls"], optional = true }
argon2 = { version = "0.6.0", optional = true }
async-trait = { version = "0.1.92", optional = true }
posthog-rs = { version = "0.30.0", default-features = false, features = ["async-client"], optional = true }
time = { version = "0.3.44", default-features = false }
palette = { version = "0.7.6", default-features = false }

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:tokio",
    "dep:axum_session",
    "dep:axum_session_auth",
    "dep:axum_session_sqlx",
    "dep:argon2",
    "dep:async-trait",
    "dep:posthog-rs",
]
