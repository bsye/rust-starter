[package]
name = "rust-starter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "fullstack"] }
anyhow = { version = "1.0.104", optional = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:anyhow"]
